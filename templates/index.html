<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>データ入力・一括印刷 PoC</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="container">
    <h1>データ入力・一括印刷 PoC</h1>

    <section class="panel">
      <div class="grid">
        <label>日付 <input id="date" type="date"></label>
        <label>社員名簿
          <select id="rosterSelect">
            <option value="">名簿から選択</option>
          </select>
        </label>
        <label>社員番号 <input id="employeeNumber" type="text" autocomplete="off"></label>
        <label>氏名 <input id="employeeName" type="text" autocomplete="off"></label>
        <label>開始時刻 <input id="startTime" type="time" step="60"></label>
        <label>終了時刻 <input id="endTime" type="time" step="60"></label>
        <label>理由 <input id="reason" type="text"></label>
        <label class="full-width">備考 <textarea id="remarks" rows="3"></textarea></label>
      </div>

      <div class="actions">
        <button id="saveButton" type="button">保存</button>
        <button id="confirmButton" type="button">Excel 一括出力（確定）</button>
      </div>
    </section>

    <section class="panel">
      <h2>保存済みデータ</h2>
      <table>
        <thead>
          <tr>
            <th>日付</th>
            <th>社員番号</th>
            <th>氏名</th>
            <th>理由</th>
            <th>開始時刻</th>
            <th>終了時刻</th>
            <th>備考</th>
          </tr>
        </thead>
        <tbody id="entriesBody"></tbody>
      </table>
      <p id="emptyState" class="empty-state">データがありません。</p>
    </section>

    <section class="panel">
      <div id="messageArea" class="message" aria-live="polite"></div>
    </section>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
